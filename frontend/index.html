<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; color: red; z-index: 999999; padding: 20px; font-family: monospace; white-space: pre-wrap; overflow: auto;"></div>
    <script>
      window.addEventListener('error', function(event) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-overlay').innerText = 'ERROR: ' + event.message + '\n' + event.filename + ':' + event.lineno + '\n\n' + (event.error ? event.error.stack : '');
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-overlay').innerText = 'UNHANDLED PROMISE REJECTION: ' + (event.reason ? (event.reason.stack || event.reason) : event);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
