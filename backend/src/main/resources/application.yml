spring:
  application:
    name: clinic-management-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-at-least-32-characters}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:671408550070-p77dnfqdf4m1eqnqgl03261bvshaoblu.apps.googleusercontent.com}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
  upload:
    avatar-dir: ${AVATAR_UPLOAD_DIR:uploads/avatars}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
  seed:
    admin-email: ${APP_ADMIN_EMAIL:admin@example.com}
    admin-password: ${APP_ADMIN_PASSWORD:123456}
